user  nginx;    # ? Defines user and group credentials used by worker processes. If group is omitted, a group whose name equals that of user is used
worker_processes  auto; # ? this defines the total number of worker processes - auto means that there is a worker process for each cpu core

# * Raise the OS file descriptor limit per worker process
# ? Changes the limit on the maximum number of open files (RLIMIT_NOFILE) for worker processes. Used to increase the limit without restarting the main process.
worker_rlimit_nofile 65535;

# ? Configures logging. Several logs can be specified on the same configuration level (1.5.2). If on the main configuration level writing a log to a file is not explicitly defined, the default file will be used.
error_log  /var/log/nginx/error.log warn;
# ? Defines a file that will store the process ID of the main process.
pid        /var/run/nginx.pid;

events {
    # * Allows each worker to handle 16,384 simultaneous sockets (client + upstream)
    worker_connections 16384; # ? this is the total umber of connections that any one nginx worker can open
    use epoll; # ? Specifies the connection processing method to use. There is normally no need to specify it explicitly, because nginx will by default use the most efficient method.
    multi_accept on; # ? If multi_accept is disabled, a worker process will accept one new connection at a time. Otherwise, a worker process will accept all new connections at a time.
}

http {
    include       /etc/nginx/mime.types; # ? Includes another file, or files matching the specified mask, into configuration.
    default_type  application/octet-stream; # ? Defines the default MIME type of a response. Mapping of file name extensions to MIME types can be set with the types directive.

    # * Disable access logging globally during high-concurrency load tests to save disk I/O
    access_log off; # ? defines where client request logs are saved and which format they use

    sendfile        on; # ? Enables or disables the use of sendfile()
    tcp_nopush      on; # ? Enables or disables the use of the TCP_NOPUSH socket option on FreeBSD or the TCP_CORK socket option on Linux. The options are enabled only when sendfile is used
    tcp_nodelay     on; # ? Enables or disables the use of the TCP_NODELAY option. The option is enabled when a connection is transitioned into the keep-alive state. Additionally, it is enabled on SSL connections, for unbuffered proxying, and for WebSocket proxying.

    # * Keep client-to-Nginx connections warm across all 50,000+ k6 iterations
    keepalive_timeout  65; # ? The first parameter sets a timeout during which a keep-alive client connection will stay open on the server side. The zero value disables keep-alive client connections. The optional second parameter sets a value in the “Keep-Alive: timeout=time” response header field. Two parameters may differ.
    keepalive_requests 100000; # ? Sets the maximum number of requests that can be served through one keep-alive connection. After the maximum number of requests are made, the connection is closed.

    # * Load your existing upstream and server blocks
    include /etc/nginx/conf.d/*.conf; # ? Includes another file, or files matching the specified mask, into configuration.
}