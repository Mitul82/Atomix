map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream react-frontend {
    server frontend:80;
}

upstream node-service {
    keepalive 1024;
    keepalive_timeout 60s;
    keepalive_requests 100000;
    server node-service:3000;
}

upstream spring-ledger {
    server spring-ledger:3001;
}

server {
    listen 80;
    server_name nginx-proxy;

    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; -> only for when deploying with real ssl certs

    location / {
        proxy_pass http://react-frontend;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        client_max_body_size 100M;

        proxy_pass http://node-service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/v1/ledger {
        proxy_pass http://spring-ledger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}