services:
  postgres:
    image: postgres:18-alpine
    container_name: Atomix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    networks:
      - atomix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1GB --maxmemory-policy noeviction
    container_name: Atomix-redis
    networks:
      - atomix-network
    deploy:
      resources:
        limits:
          memory: 1GB
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: Atomix-rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - atomix-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: Atomix-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    networks:
      - atomix-network
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  node-service:
    container_name: Atomix-node-service
    build:
      context: ./node-backend
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      LEDGER_URL: ${LEDGER_URL}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      spring-ledger:
        condition: service_started
    restart: unless-stopped
    networks:
      - atomix-network
    
  spring-ledger:
    container_name: Atomix-spring-ledger
    build:
      context: ./spring-backend
      dockerfile: Dockerfile
    environment:
      REDIS_PORT: ${REDIS_PORT}
      REDIS_HOST: ${REDIS_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_URL: ${POSTGRES_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - atomix-network

  frontend:
    container_name: Atomix-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_EDGE_URL: ${VITE_EDGE_URL}
        VITE_LEDGER_URL: ${VITE_LEDGER_URL}
    environment:
      VITE_EDGE_URL: ${VITE_EDGE_URL}
      VITE_LEDGER_URL: ${VITE_LEDGER_URL}   
    depends_on:
      node-service:
        condition: service_started
      spring-ledger:
        condition: service_started
    restart: unless-stopped
    networks:
      - atomix-network
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1GB

  nginx-proxy:
    image: nginx:alpine
    container_name: Atomix-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: 
      frontend:
        condition: service_started
    networks:
      - atomix-network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  rabbitmq_data:
  rabbitmq_logs:
  pgadmin_data:

networks:
  atomix-network:
   name: atomix-network
   driver: bridge