spring:
    config:
            import: optional:file:.env[.properties]
    application:
        name: springbackend

    datasource:
        url: ${POSTGRES_URL}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        hikari:
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                '[format_sql]': true

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}

    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT}
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASS}
        listener:
            simple:
                acknowledge-mode: auto
                prefetch: 25 # pulls max 25 messages per consumer thread at once
                concurrency: 4
                max-concurrency: 8
                default-requeue-rejected: false

server:
    port: 3001

api.prefix: '/api/v1'